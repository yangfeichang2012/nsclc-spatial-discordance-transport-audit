name: reproduce-and-validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  reproduce:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate_archive.py
      - run: python scripts/download_inputs.py
      - run: python scripts/reproduce_analysis.py --output ci_results
      - run: python scripts/render_figures.py
